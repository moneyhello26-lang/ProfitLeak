name: Verify release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: profitleak_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: profitleak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profitleak_test -d profitleak_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LLM_ENABLED: "false"
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://profitleak_test:test-only-password@localhost:5432/profitleak_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e './backend[dev,postgres]'
      - run: python -m pytest backend/tests -q
      - run: python backend/scripts/export_openapi.py --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
